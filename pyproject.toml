[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "physics-through-anim"
version = "0.1.0"
description = "Offline-first Manim studio for physics lessons with narration."
requires-python = ">=3.11,<3.12"
dependencies = [
    "manim==0.21.0",
    "manim-physics==0.2.4",
    "manim-voiceover[gtts]>=0.4.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/physics_through_anim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
